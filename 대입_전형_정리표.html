<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대입 전형 정리표</title>
<style>
  :root{
    --bg:#ffffff; --bg-soft:#fafafa; --border:#e6e6e6; --border-soft:#f0f0f0;
    --text:#1a1a1a; --text-soft:#6b6b6b; --text-faint:#9a9a9a;
    --accent:#d97757; --accent-soft:#fbeee7; --accent-deep:#b5583a;
    --green:#2f8a56; --green-bg:#e7f5ec; --amber:#b8860b; --amber-bg:#fbf3d9;
    --red:#c0392b; --red-bg:#fbe9e7; --gray:#8a94a6; --gray-bg:#eef0f3;
    --radius:10px; --shadow-sm:0 1px 2px rgba(0,0,0,0.04); --shadow-md:0 4px 14px rgba(0,0,0,0.08);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#17181a; --bg-soft:#1f2023; --border:#302f32; --border-soft:#26262a;
    --text:#f0efec; --text-soft:#b4b1ac; --text-faint:#7d7a75;
    --accent:#e2896a; --accent-soft:#332420; --accent-deep:#f0a184;
  }
  html[data-theme="dark"] .board, html[data-theme="dark"] .modal, html[data-theme="dark"] .google-btn,
  html[data-theme="dark"] .btn, html[data-theme="dark"] header, html[data-theme="dark"] .entry-card,
  html[data-theme="dark"] .menu-dropdown{ background:var(--bg); color:var(--text); }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg-soft); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; transition:background .2s, color .2s; }

  header{ background:var(--bg); border-bottom:1px solid var(--border); padding:16px 28px; position:sticky; top:0; z-index:30; }
  .headrow{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:30px; height:30px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; }
  .brand .titles h1{ font-size:16px; margin:0; font-weight:700; letter-spacing:-.01em; }
  .brand .titles p{ font-size:12px; margin:0; color:var(--text-soft); }
  .headright{ display:flex; align-items:center; gap:10px; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{ font-size:13px; border:1px solid var(--border); background:#fff; color:var(--text); padding:8px 14px; border-radius:8px; transition:.12s; }
  .btn:hover{ background:var(--bg-soft); border-color:#d8d8d8; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.primary:hover{ background:var(--accent-deep); border-color:var(--accent-deep); }
  .btn.subtle{ background:transparent; border:none; color:var(--text-soft); padding:8px 10px; }
  .btn.subtle:hover{ background:var(--bg-soft); color:var(--text); }
  .btn.danger-text{ color:var(--red); }

  .google-btn{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; border:1px solid var(--border); background:#fff; padding:8px 14px; border-radius:8px; }
  .google-btn:hover{ background:var(--bg-soft); }
  .google-g{ width:16px; height:16px; }
  .userchip{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-soft); background:var(--bg-soft); padding:6px 12px; border-radius:20px; border:1px solid var(--border); }
  .userchip .dot{ width:7px; height:7px; border-radius:50%; background:#3aa76d; }

  .menu-wrap{ position:relative; }
  .menu-btn{ width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .menu-btn:hover{ background:var(--bg-soft); }
  .menu-dropdown{ position:absolute; right:0; top:44px; background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-md); width:230px; padding:6px; display:none; z-index:40; }
  .menu-dropdown.open{ display:block; }
  .menu-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px; border-radius:7px; border:none; background:none; font-size:13px; color:var(--text); }
  .menu-item:hover{ background:var(--bg-soft); }
  .menu-item.danger{ color:var(--red); }
  .menu-sep{ height:1px; background:var(--border-soft); margin:6px 4px; }
  .menu-hidden-input{ display:none; }

  .subheadrow{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; flex-wrap:wrap; gap:10px; }
  .toolbar-left{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tabs{ display:flex; gap:6px; }
  .tabs button{ font-size:13px; padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--text-soft); }
  .tabs button.active-tab{ background:var(--text); color:#fff; border-color:var(--text); font-weight:600; }
  .savebar{ display:flex; gap:8px; font-size:11.5px; color:var(--text-faint); }
  .savebar .pill{ background:var(--bg-soft); border:1px solid var(--border-soft); padding:3px 9px; border-radius:12px; }

  .content-wrap{ padding:22px 28px 80px; }

  .filters{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--text-soft);}
  .filters select{ padding:7px 9px; border-radius:8px; border:1px solid var(--border); font-family:inherit; background:#fff; }

  .uni-group{ margin-bottom:26px; }
  .uni-group h2{ font-size:16px; font-weight:700; color:var(--text); margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .uni-group h2 .count{ font-size:11.5px; color:var(--text-faint); font-weight:400; }

  .cards-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:14px; }
  .adm-card{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px 17px;
    box-shadow:var(--shadow-sm); cursor:pointer; position:relative; transition:.14s; }
  .adm-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:#d8d8d8; }
  .adm-card .stripe{ position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px; background:var(--gray); }
  .adm-card.prob-상 .stripe{ background:var(--green); }
  .adm-card.prob-중 .stripe{ background:var(--amber); }
  .adm-card.prob-하 .stripe{ background:var(--red); }
  .adm-card .badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:10px; margin-bottom:8px; }
  .badge.prob-상{ background:var(--green-bg); color:var(--green); }
  .badge.prob-중{ background:var(--amber-bg); color:var(--amber); }
  .badge.prob-하{ background:var(--red-bg); color:var(--red); }
  .badge.prob-미정{ background:var(--gray-bg); color:var(--gray); }
  .adm-card .type{ font-size:11.5px; color:var(--text-soft); margin-bottom:2px; }
  .adm-card .dept{ font-size:15.5px; font-weight:700; color:var(--text); margin-bottom:8px; }
  .adm-card .metaline{ font-size:11px; color:var(--text-soft); display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .adm-card .metaline span{ background:var(--bg-soft); padding:3px 8px; border-radius:5px; }
  .adm-card .cardtag{ position:absolute; top:14px; right:14px; font-size:10px; color:var(--accent-deep); font-weight:700; background:var(--accent-soft); padding:2px 8px; border-radius:8px; }
  .adm-card .dup-btn{ position:absolute; bottom:12px; right:12px; font-size:10.5px; background:var(--bg-soft); border:1px solid var(--border); color:var(--text-soft); padding:4px 8px; border-radius:6px; }
  .adm-card .dup-btn:hover{ background:var(--accent-soft); color:var(--accent-deep); border-color:var(--accent); }

  .empty-note{padding:50px 20px; text-align:center; color:var(--text-faint); font-size:13px; background:#fff; border-radius:var(--radius); border:1px solid var(--border); }

  .cal-wrap{ background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:20px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-head h2{ font-size:16px; font-weight:700; color:var(--text); margin:0; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{ color:var(--text); border:1px solid var(--border); background:#fff; width:32px; height:32px; border-radius:8px; }
  .cal-nav button:hover{ background:var(--bg-soft); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:0; border:1px solid var(--border-soft); border-radius:8px; overflow:hidden; }
  .cal-dow{ text-align:center; font-size:11px; color:var(--text-faint); font-weight:700; padding:4px 0; border-bottom:1px solid var(--border-soft); background:var(--bg-soft); }
  .cal-day{ min-height:92px; border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); padding:6px 6px 8px; font-size:11px; background:#fff; position:relative; }
  .cal-day:nth-child(7n){ border-right:none; }
  .cal-day.other-month{ background:var(--bg-soft); opacity:.55; }
  .cal-day .num{ font-weight:700; color:var(--text); font-size:12px; margin-bottom:4px; }
  .period-bars{ display:flex; flex-direction:column; gap:2px; margin:0 -6px 4px; }
  .period-bar{ height:7px; cursor:pointer; opacity:.85; }
  .period-bar:hover{ opacity:1; }
  .period-bar.is-start{ margin-left:6px; border-top-left-radius:5px; border-bottom-left-radius:5px; }
  .period-bar.is-end{ margin-right:6px; border-top-right-radius:5px; border-bottom-right-radius:5px; }
  .period-bar.is-start.is-end{ margin-left:6px; margin-right:6px; }

  /* D-day 목록 */
  .dday-filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .dday-chip{ font-size:11.5px; background:#fff; color:var(--text-soft); border:1px solid var(--border); padding:6px 12px; border-radius:14px; cursor:pointer; }
  .dday-chip.active{ background:var(--text); color:#fff; border-color:var(--text); }
  .dday-list{ display:flex; flex-direction:column; gap:8px; }
  .dday-item{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 16px; box-shadow:var(--shadow-sm); cursor:pointer; transition:.12s; }
  .dday-item:hover{ box-shadow:var(--shadow-md); border-color:#d8d8d8; }
  .dday-item.past{ opacity:.5; }
  .dday-colordot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .dday-badge{ font-size:12px; font-weight:800; padding:5px 11px; border-radius:8px; min-width:56px; text-align:center; flex-shrink:0; }
  .dday-badge.today{ background:var(--red); color:#fff; }
  .dday-badge.soon{ background:var(--amber-bg); color:var(--amber); }
  .dday-badge.later{ background:var(--gray-bg); color:var(--gray); }
  .dday-badge.past{ background:var(--gray-bg); color:var(--text-faint); }
  .dday-info{ flex:1; min-width:0; }
  .dday-info .title{ font-size:13.5px; font-weight:700; color:var(--text); }
  .dday-info .sub{ font-size:11.5px; color:var(--text-soft); margin-top:1px; }
  .dday-date{ font-size:11.5px; color:var(--text-faint); flex-shrink:0; }
  .color-swatches{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .color-swatch{ width:26px; height:26px; border-radius:7px; cursor:pointer; border:2px solid transparent; }
  .color-swatch.selected{ border-color:var(--text); }
  .cal-event{ font-size:10px; padding:3px 6px; border-radius:5px; margin-bottom:3px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-event.prob-상{ background:var(--green-bg); color:var(--green); }
  .cal-event.prob-중{ background:var(--amber-bg); color:var(--amber); }
  .cal-event.prob-하{ background:var(--red-bg); color:var(--red); }
  .cal-event.prob-미정{ background:var(--gray-bg); color:var(--gray); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,20,20,0.35); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-backdrop.open{display:flex;}
  .modal{ background:#fff; width:min(680px, 100%); max-height:90vh; overflow-y:auto; border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.18); padding:26px 28px; }
  .modal h2{margin:0 0 4px; font-size:19px; font-weight:700; color:var(--text);}
  .modal .sub{font-size:12px; color:var(--text-faint); margin-bottom:18px;}

  .view-title{ font-size:20px; font-weight:700; margin-bottom:2px; }
  .view-sub{ font-size:13px; color:var(--text-soft); margin-bottom:14px; }
  .view-badge{ display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; margin-bottom:12px; }
  .view-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:18px; }
  .view-item .label{ font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px; }
  .view-item .val{ font-size:13.5px; color:var(--text); }
  .view-section{ margin-bottom:16px; }
  .view-section .label{ font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
  .view-content{ font-size:13.5px; line-height:1.6; color:var(--text); white-space:pre-wrap; }
  .view-empty{ color:var(--text-faint); font-size:13px; font-style:italic; }
  .view-q{ background:var(--bg-soft); border-radius:8px; padding:9px 12px; margin-bottom:6px; font-size:13px; }
  .file-list, .link-list{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
  .file-item, .link-item{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-soft); border-radius:6px; padding:6px 9px; font-size:11.5px; }
  .file-item a, .link-item a{color:var(--accent-deep); text-decoration:none; font-weight:600;}
  .file-item a:hover, .link-item a:hover{text-decoration:underline;}
  .view-file, .view-link{ display:block; font-size:13px; color:var(--accent-deep); text-decoration:none; margin-bottom:4px; }
  .view-file:hover, .view-link:hover{ text-decoration:underline; }

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field textarea, .field select{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:13.5px; background:#fff; color:var(--text); }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .field textarea{min-height:56px; resize:vertical;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  .checkline{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .chip-toggle-group{display:flex; flex-wrap:wrap; gap:6px;}
  .chip-toggle{ font-size:11.5px; background:var(--bg-soft); color:var(--text-soft); border:1px solid var(--border); padding:6px 11px; border-radius:14px; cursor:pointer; }
  .chip-toggle.active{background:var(--text); color:#fff; border-color:var(--text);}
  .q-item{ display:flex; gap:6px; margin-bottom:6px; }
  .q-item textarea{ flex:1; min-height:40px; }
  .x-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:0 6px;}
  .prob-select{ display:flex; gap:8px; }
  .prob-opt{ flex:1; text-align:center; padding:9px; border-radius:8px; border:1.5px solid var(--border); cursor:pointer; font-size:12.5px; font-weight:700; color:var(--text-soft);}
  .prob-opt.sel-상.selected{ border-color:var(--green); background:var(--green-bg); color:var(--green); }
  .prob-opt.sel-중.selected{ border-color:var(--amber); background:var(--amber-bg); color:var(--amber); }
  .prob-opt.sel-하.selected{ border-color:var(--red); background:var(--red-bg); color:var(--red); }
  .prob-opt.sel-미정.selected{ border-color:var(--gray); background:var(--gray-bg); color:var(--gray); }
  .modal-actions{display:flex; justify-content:space-between; margin-top:20px; gap:8px;}
  .modal-actions .left{display:flex; gap:8px;}
  small.hint{color:var(--text-faint); font-size:11px; display:block; margin-top:4px;}

  footer{text-align:center; font-size:11.5px; color:var(--text-faint); padding:24px;}
  .save-indicator{ position:fixed; bottom:20px; right:20px; background:var(--text); color:#fff; font-size:12px;
    padding:9px 16px; border-radius:20px; opacity:0; transition:opacity .3s; box-shadow:var(--shadow-md); z-index:60; }
  .save-indicator.show{opacity:1;}
  .save-indicator.error{background:var(--red);}
</style>
</head>
<body>

<header>
  <div class="headrow">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"></path>
          <path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"></path>
        </svg>
      </div>
      <div class="titles">
        <h1>대입 전형 정리표</h1>
        <p>대학 · 전형 · 학과별 정보와 일정 관리</p>
      </div>
    </div>
    <div class="headright">
      <div id="signedOutBlock">
        <button class="google-btn" id="googleLoginBtn">
          <svg class="google-g" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.6 5.6C39.9 37 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Google로 계속하기
        </button>
      </div>
      <div id="signedInBlock" style="display:none;">
        <div class="userchip"><span class="dot"></span><span id="userEmail"></span><button class="btn subtle" id="logoutBtn" style="padding:2px 6px;">로그아웃</button></div>
      </div>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="menu-dropdown" id="menuDropdown">
          <button class="menu-item" id="loadSampleBtn">🧪 예시 데이터로 미리보기</button>
          <button class="menu-item" id="exportBtn">⬇️ 백업 파일 다운로드</button>
          <button class="menu-item" id="importTrigger">⬆️ 백업 파일 불러오기</button>
          <input type="file" id="importInput" class="menu-hidden-input" accept="application/json">
          <div class="menu-sep"></div>
          <button class="menu-item" id="goLedgerBtn">📖 생기부 이력표로 이동</button>
          <button class="menu-item" id="goMainBtn">🏠 메인 사이트로</button>
          <button class="menu-item" id="themeToggleBtn">🌓 다크모드 전환</button>
          <div class="menu-sep"></div>
          <button class="menu-item" id="restoreBackupBtn">🩹 자동 백업에서 복원</button>
          <div class="menu-sep"></div>
          <button class="menu-item danger" id="clearBtn">🗑 전체 초기화</button>
        </div>
      </div>
    </div>
  </div>
  <div class="subheadrow">
    <div class="toolbar-left">
      <button class="btn primary" id="addAdmBtn">＋ 대학/전형 추가</button>
      <button class="btn" id="addEventBtn">📌 내 일정 추가</button>
      <div class="tabs">
        <button id="tabList" class="active-tab">목록 보기</button>
        <button id="tabCal">캘린더 보기</button>
        <button id="tabDday">D-day 목록</button>
      </div>
    </div>
    <div class="savebar">
      <span class="pill" id="saveTimestamp">저장 기록 없음</span>
      <span class="pill" id="cloudStatus">클라우드 미설정</span>
    </div>
  </div>
</header>

<div class="content-wrap">
  <div id="listView">
    <div class="filters">
      <span>정렬</span>
      <select id="sortSelect">

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 이 화면 안에서 쓰는 날짜를 항상 "이 브라우저의 지역 시간" 기준 YYYY-MM-DD 문자열로 만드는 함수.
   ⚠️ 이전 버전은 여기서 date.toISOString().slice(0,10) 을 사용했는데, toISOString()은 항상 UTC 기준으로
   변환합니다. 한국(UTC+9)에서는 자정(00:00)이 UTC로는 "전날 15:00"이 되기 때문에, 캘린더 칸이 실제로
   보여주는 날짜(예: 27일)와, 그 칸을 찾을 때 쓰는 날짜 문자열(예: "26일")이 하루 어긋나는 문제가 있었습니다.
   그 결과 면접 날짜를 26일로 입력해도 캘린더에는 27일 칸에 표시되는 오류가 발생했습니다. (공주대 면접 건이 이 경우입니다.)
   실제 데이터(면접일 등)는 그대로 26일로 잘 저장되어 있었고, 화면에 그리는 로직에서만 하루가 밀렸던 것이라
   "지우고 다시 만들어도" 똑같이 재현됐던 것입니다. 아래처럼 지역 시간 기준으로 문자열을 만들면 해결됩니다. */
function localDateStr(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* ---------- Firebase ---------- */
let fbAuth=null, fbDb=null, currentUser=null, cloudReady=false;
try{
  if(firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('여기에')){
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth(); fbDb = firebase.firestore(); cloudReady = true;
    document.getElementById('cloudStatus').textContent = '클라우드 연결됨';
  }else{
    document.getElementById('cloudStatus').textContent = '클라우드 설정 안 됨';
  }
}catch(e){ document.getElementById('cloudStatus').textContent='클라우드 연결 실패'; console.error(e); }

if(cloudReady){
  fbAuth.onAuthStateChanged(async (user)=>{
    currentUser = user;
    if(user){
      document.getElementById('signedOutBlock').style.display='none';
      document.getElementById('signedInBlock').style.display='block';
      document.getElementById('userEmail').textContent = user.email || user.displayName || '로그인됨';
      await loadFromCloud();
    }else{
      document.getElementById('signedOutBlock').style.display='block';
      document.getElementById('signedInBlock').style.display='none';
      renderAll();
    }
  });
  document.getElementById('googleLoginBtn').addEventListener('click', async ()=>{
    const provider = new firebase.auth.GoogleAuthProvider();
    try{ await fbAuth.signInWithPopup(provider); }catch(e){ alert('로그인 실패: '+e.message); }
  });
  document.getElementById('logoutBtn').addEventListener('click', ()=> fbAuth.signOut());
}else{
  document.getElementById('signedOutBlock').style.display='none';
}

/* ---------- 클라우드 동기화 (파일은 로컬 전용, 나머지는 클라우드 동기화) ----------
   - 사진/파일(base64)은 용량이 커서 Firestore 문서 1MB 제한을 쉽게 넘길 수 있으므로 클라우드에 올리지 않고 이 브라우저에만 저장합니다.
   - 클라우드 ↔ 로컬 중 더 최근에 저장된 쪽을 신뢰하고, 덮어쓰기 전에는 항상 로컬 백업을 남깁니다. */
function stripFilesForCloud(admissions){
  const out = {};
  Object.values(admissions).forEach(a=>{
    const { files, ...rest } = a;
    out[a.id] = rest; // files 필드는 클라우드에 저장하지 않음
  });
  return out;
}
function mergeLocalFiles(cloudAdmissions, localAdmissions){
  const merged = {};
  Object.values(cloudAdmissions||{}).forEach(a=>{
    const localMatch = localAdmissions ? localAdmissions[a.id] : null;
    merged[a.id] = { ...a, files: (localMatch && localMatch.files) ? localMatch.files : (a.files || []) };
  });
  return merged;
}
function backupLocalState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) localStorage.setItem(STORAGE_KEY + '_backup', raw);
  }catch(e){ console.error(e); }
}

async function loadFromCloud(){
  if(!cloudReady || !currentUser) return;
  try{
    const doc = await fbDb.collection('users').doc(currentUser.uid).collection('admissions').doc('main').get();
    if(!doc.exists){
      await saveToCloud();
      renderAll();
      return;
    }
    const cloudData = doc.data();
    const localBeforeSync = loadLocal(); // 지금 이 브라우저에 실제로 있던 데이터(덮어쓰기 직전 스냅샷)
    const cloudTime = cloudData.lastSaved ? new Date(cloudData.lastSaved).getTime() : 0;
    const localTime = (localBeforeSync && localBeforeSync.lastSaved) ? new Date(localBeforeSync.lastSaved).getTime() : 0;

    if(cloudTime > localTime){
      // 클라우드가 더 최신 → 로컬을 클라우드로 교체하되, 먼저 백업하고 파일은 로컬 것을 유지
      backupLocalState();
      const mergedAdmissions = mergeLocalFiles(cloudData.admissions||{}, localBeforeSync ? localBeforeSync.admissions : {});
      state = { admissions: mergedAdmissions, customEvents: cloudData.customEvents||{}, lastSaved: cloudData.lastSaved||null };
      saveLocal();
    }else if(localTime > cloudTime){
      // 로컬이 더 최신(예: 클라우드 저장이 실패했던 경우) → 로컬을 그대로 유지하고 클라우드에 다시 올림
      state = localBeforeSync;
      await saveToCloud();
    }else{
      // 동일 시각 → 그대로 사용
      if(localBeforeSync) state = localBeforeSync;
    }
  }catch(e){ console.error(e); showIndicator('클라우드 불러오기 실패 (로컬 데이터 유지)', true); }
  renderAll();
}
async function saveToCloud(){
  if(!cloudReady || !currentUser) return;
  try{
    await fbDb.collection('users').doc(currentUser.uid).collection('admissions').doc('main')
      .set({ admissions: stripFilesForCloud(state.admissions), customEvents: state.customEvents||{}, lastSaved: state.lastSaved || new Date().toISOString() });
  }catch(e){ console.error(e); showIndicator('클라우드 저장 실패 (로컬에는 저장됨, 나중에 다시 시도됩니다)', true); }
}
function saveLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadLocal(){ try{ const raw=localStorage.getItem(STORAGE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
async function persist(){
  state.lastSaved = new Date().toISOString();
  saveLocal(); updateTimestamp(); showIndicator('저장됨');
  await saveToCloud();
}
function updateTimestamp(){
  const el = document.getElementById('saveTimestamp');
  el.textContent = state.lastSaved ? '마지막 저장 ' + new Date(state.lastSaved).toLocaleString('ko-KR') : '저장 기록 없음';
}
function showIndicator(msg, isError){
  const ind = document.getElementById('saveIndicator');
  ind.textContent = msg; ind.classList.toggle('error', !!isError); ind.classList.add('show');
  clearTimeout(showIndicator._t); showIndicator._t = setTimeout(()=>ind.classList.remove('show'), 1500);
}

/* ---------- list ---------- */
const PROB_ORDER = {'상':0,'중':1,'하':2,'미정':3};
let activeFilters = { recommendation:false, selfIntro:false, interview:false, choi:false, card:'all' };
function renderAll(){ renderList(); updateTimestamp(); if(currentView==='cal') renderCalendar(); if(currentView==='dday') renderDday(); }
document.getElementById('sortSelect').addEventListener('change', renderList);
document.getElementById('filterCard').addEventListener('change', (e)=>{ activeFilters.card = e.target.value; renderList(); });
document.querySelectorAll('#filterChips .chip-toggle').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    const key = chip.dataset.filter;
    activeFilters[key] = !activeFilters[key];
    chip.classList.toggle('active', activeFilters[key]);
    renderList();
  });
});
document.getElementById('filterResetBtn').addEventListener('click', ()=>{
  activeFilters = { recommendation:false, selfIntro:false, interview:false, choi:false, card:'all' };
  document.querySelectorAll('#filterChips .chip-toggle').forEach(c=> c.classList.remove('active'));
  document.getElementById('filterCard').value = 'all';
  renderList();
});
function applyFilters(list){
  return list.filter(a=>{
    if(activeFilters.recommendation && !a.recommendation) return false;
    if(activeFilters.selfIntro && !a.selfIntroRequired) return false;
    if(activeFilters.interview && !a.interviewRequired) return false;
    if(activeFilters.choi && !a.suneungChoi) return false;
    if(activeFilters.card === 'card' && a.isCardSchool === false) return false;
    if(activeFilters.card === 'noncard' && a.isCardSchool !== false) return false;
    return true;
  });
}

function renderList(){
  const container = document.getElementById('listContainer');
  container.innerHTML = '';
  const all = applyFilters(Object.values(state.admissions));
  if(Object.keys(state.admissions).length === 0){
    container.innerHTML = '<div class="empty-note">아직 등록된 대학/전형이 없습니다. "대학/전형 추가"를 누르거나 메뉴에서 예시 데이터를 불러와보세요.</div>';
    return;
  }
  if(all.length === 0){
    container.innerHTML = '<div class="empty-note">선택한 필터 조건에 맞는 대학/전형이 없습니다. "필터 초기화"를 눌러보세요.</div>';
    return;
  }
  const sortMode = document.getElementById('sortSelect').value;
  const byUni = {};
  all.forEach(a=>{ (byUni[a.university] = byUni[a.university]||[]).push(a); });
  let uniNames = Object.keys(byUni);
  if(sortMode==='uni'){ uniNames.sort((a,b)=>a.localeCompare(b,'ko')); }
  else{
    uniNames.sort((a,b)=>{
      const ra = Math.min(...byUni[a].map(x=>PROB_ORDER[x.probability||'미정']));
      const rb = Math.min(...byUni[b].map(x=>PROB_ORDER[x.probability||'미정']));
      return ra-rb;
    });
  }
  uniNames.forEach(uniName=>{
    let list = byUni[uniName].slice();
    if(sortMode==='prob'){ list.sort((a,b)=>PROB_ORDER[a.probability||'미정']-PROB_ORDER[b.probability||'미정']); }
    else if(sortMode==='interviewDate'){ list.sort((a,b)=> (a.interviewDate||'9999').localeCompare(b.interviewDate||'9999')); }
    else if(sortMode==='announceDate'){ list.sort((a,b)=> (a.announceDate||'9999').localeCompare(b.announceDate||'9999')); }

    const group = document.createElement('div'); group.className='uni-group';
    group.innerHTML = `<h2>${escapeHtml(uniName)} <span class="count">${list.length}개</span></h2>`;
    const grid = document.createElement('div'); grid.className='cards-grid';
    list.forEach(a=>{
      const card = document.createElement('div');
      card.className = 'adm-card prob-' + (a.probability||'미정');
      let meta = [];
      if(a.applicationStart||a.applicationEnd) meta.push('원서접수 '+(a.applicationStart||'?')+'~'+(a.applicationEnd||'?'));
      if(a.round1Ratio) meta.push('1차 '+a.round1Ratio);
      if(a.round1AnnounceDate) meta.push('서류발표 '+a.round1AnnounceDate);
      if(a.interviewRequired) meta.push('면접 있음');
      if(a.documentWeight) meta.push('서류비율 '+a.documentWeight);
      if(a.interviewWeight) meta.push('면접비율 '+a.interviewWeight);
      if(a.interviewDate) meta.push('면접일 '+a.interviewDate);
      if(a.announceDate) meta.push('최종발표 '+a.announceDate);
      if(a.suneungChoi) meta.push('수능최저 O');
      if(a.recommendation) meta.push('추천서 O');
      if(a.selfIntroRequired) meta.push('자소서 O');
      card.innerHTML = `
        <div class="stripe"></div>
        ${a.isCardSchool ? '<div class="cardtag">6장 카드</div>' : ''}
        <span class="badge prob-${a.probability||'미정'}">${a.probability||'미정'}</span>
        <div class="type">${escapeHtml(a.admissionType||'전형명 미입력')} ${(a.files&&a.files.length)?'📎':''}${(a.links&&a.links.length)?'🔗':''}</div>
        <div class="dept">${escapeHtml(a.department||'학과 미입력')}</div>
        <div class="metaline">${meta.map(m=>`<span>${escapeHtml(m)}</span>`).join('')}</div>
        <button class="dup-btn" type="button">📋 복사</button>
      `;
      card.querySelector('.dup-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        const newId = uid('adm');
        state.admissions[newId] = { ...a, id:newId, department: a.department + ' (사본)' };
        persist(); renderAll();
        openModal(newId, 'edit');
        showIndicator('복사되었습니다. 대학/학과를 수정해주세요.');
      });
      card.addEventListener('click', ()=> openModal(a.id, 'view'));
      grid.appendChild(card);
    });
    group.appendChild(grid);
    container.appendChild(group);
  });
}

/* ---------- calendar ---------- */
function renderCalendar(){
  if(calYear===undefined){ const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth(); }
  document.getElementById('calTitle').textContent = `${calYear}년 ${calMonth+1}월`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['일','월','화','수','목','금','토'].forEach(d=>{
    const el = document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });
  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

  const events = {};
  function addEvent(dateStr, label, prob, id){
    if(!dateStr) return;
    (events[dateStr] = events[dateStr]||[]).push({label, prob:prob||'미정', id});
  }
  Object.values(state.admissions).forEach(a=>{
    addEvent(a.round1AnnounceDate, `📄 ${a.university} 서류(1차) 발표`, a.probability, a.id);
    if(a.interviewRequired){ addEvent(a.interviewDate, `🎤 ${a.university} 면접`, a.probability, a.id); }
    addEvent(a.announceDate, `📢 ${a.university} 최종 발표`, a.probability, a.id);
  });
  Object.values(state.customEvents||{}).forEach(ev=>{
    (events[ev.date] = events[ev.date]||[]).push({label: `📌 ${ev.title}`, prob:null, id: ev.id, isCustom:true, color: ev.color});
  });

  // 원서접수 기간(시작일~종료일)을 이어지는 색상 바로 표시하기 위한 목록
  const periods = Object.values(state.admissions)
    .filter(a=> a.applicationStart && a.applicationEnd)
    .map(a=> ({ id:a.id, university:a.university, start:a.applicationStart, end:a.applicationEnd, color:a.periodColor||'#d97757' }));

  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;

  // 1단계: 모든 셀의 날짜 정보를 먼저 계산 (지역 시간 기준 문자열 사용 — localDateStr 참고)
  const cellInfos = [];
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startWeekday + 1;
    let realDate, otherMonth = false;
    if(dayNum < 1){ realDate = new Date(calYear, calMonth-1, daysInPrevMonth+dayNum); otherMonth = true; }
    else if(dayNum > daysInMonth){ realDate = new Date(calYear, calMonth+1, dayNum-daysInMonth); otherMonth = true; }
    else{ realDate = new Date(calYear, calMonth, dayNum); }
    cellInfos.push({ realDate, dateStr: localDateStr(realDate), otherMonth });
  }

  // 2단계: 한 주(7일) 단위로 기간 바의 레인(줄 번호)을 미리 배정해서, 같은 기간은 그 주 내내 같은 줄에 고정되도록 함
  for(let w=0; w<cellInfos.length; w+=7){
    const week = cellInfos.slice(w, w+7);
    const weekStart = week[0].dateStr, weekEnd = week[6].dateStr;
    const activeInWeek = periods
      .filter(p=> p.end>=weekStart && p.start<=weekEnd)
      .slice()
      .sort((a,b)=> a.start.localeCompare(b.start) || a.id.localeCompare(b.id));
    const laneEndDates = [];
    const laneAssignment = {};
    activeInWeek.forEach(p=>{
      let lane = 0;
      while(laneEndDates[lane] !== undefined && laneEndDates[lane] >= p.start) lane++;
      laneEndDates[lane] = p.end;
      laneAssignment[p.id] = lane;
    });
    const maxLane = activeInWeek.length ? Math.max(...activeInWeek.map(p=>laneAssignment[p.id])) : -1;
    week.forEach(c=>{ c.laneAssignment = laneAssignment; c.maxLane = maxLane; });
  }

  // 3단계: 셀 렌더링 (배정된 레인 순서대로, 빈 레인은 투명 placeholder로 채워 높이 정렬 유지)
  cellInfos.forEach(({realDate, dateStr, otherMonth, laneAssignment, maxLane})=>{
    const cell = document.createElement('div'); cell.className='cal-day';
    if(otherMonth) cell.classList.add('other-month');
    cell.innerHTML = `<div class="num">${realDate.getDate()}</div>`;

    if(maxLane >= 0){
      const barsWrap = document.createElement('div'); barsWrap.className='period-bars';
      const activePeriods = periods.filter(p=> dateStr>=p.start && dateStr<=p.end);
      const byLane = {};
      activePeriods.forEach(p=>{ byLane[laneAssignment[p.id]] = p; });
      for(let lane=0; lane<=maxLane; lane++){
        const p = byLane[lane];
        if(p){
          const bar = document.createElement('div');
          bar.className = 'period-bar' + (dateStr===p.start?' is-start':'') + (dateStr===p.end?' is-end':'');
          bar.style.background = p.color;
          bar.title = `${p.university} 원서접수 (${p.start} ~ ${p.end})`;
          bar.addEventListener('click', ()=> openModal(p.id, 'view'));
          barsWrap.appendChild(bar);
        }else{
          const spacer = document.createElement('div');
          spacer.className = 'period-bar';
          spacer.style.visibility = 'hidden';
          barsWrap.appendChild(spacer);
        }
      }
      cell.appendChild(barsWrap);
    }

    (events[dateStr]||[]).forEach(ev=>{
      const evEl = document.createElement('div');
      evEl.className = ev.isCustom ? 'cal-event' : `cal-event prob-${ev.prob}`;
      if(ev.isCustom){ evEl.style.background = (ev.color||'#3aa76d')+'22'; evEl.style.color = ev.color||'#3aa76d'; evEl.style.borderLeft = `3px solid ${ev.color||'#3aa76d'}`; }
      evEl.textContent = ev.label; evEl.title = ev.label;
      evEl.addEventListener('click', ()=> ev.isCustom ? openEventModal(ev.id) : openModal(ev.id, 'view'));
      cell.appendChild(evEl);
    });
    grid.appendChild(cell);
  });
}

/* ---------- D-day 목록 ---------- */
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}
const DDAY_FILTER_DEFS = [
  {key:'appStart', label:'원서접수 시작'},
  {key:'appEnd', label:'원서접수 마감'},
  {key:'round1', label:'서류(1차) 발표'},
  {key:'interview', label:'면접'},
  {key:'announce', label:'최종 발표'},
  {key:'custom', label:'내 일정'},
];
function renderDdayFilters(){
  const wrap = document.getElementById('ddayFilters');
  wrap.innerHTML = '';
  DDAY_FILTER_DEFS.forEach(def=>{
    const chip = document.createElement('div');
    chip.className = 'dday-chip' + (ddayFilters[def.key] ? ' active' : '');
    chip.textContent = def.label;
    chip.addEventListener('click', ()=>{ ddayFilters[def.key] = !ddayFilters[def.key]; renderDday(); });
    wrap.appendChild(chip);
  });
  const resetChip = document.createElement('div');
  resetChip.className = 'dday-chip';
  resetChip.textContent = '전체 보기';
  resetChip.addEventListener('click', ()=>{
    DDAY_FILTER_DEFS.forEach(def=> ddayFilters[def.key] = true);
    renderDday();
  });
  wrap.appendChild(resetChip);
}
function collectAllEvents(){
  const list = [];
  Object.values(state.admissions).forEach(a=>{
    if(a.applicationStart) list.push({date:a.applicationStart, title:`${a.university} 원서접수 시작`, sub:a.admissionType, color:a.periodColor||'#d97757', kind:'admission', type:'appStart', id:a.id});
    if(a.applicationEnd) list.push({date:a.applicationEnd, title:`${a.university} 원서접수 마감`, sub:a.admissionType, color:a.periodColor||'#d97757', kind:'admission', type:'appEnd', id:a.id});
    if(a.round1AnnounceDate) list.push({date:a.round1AnnounceDate, title:`${a.university} 서류(1차) 발표`, sub:a.admissionType, color:'#233350', kind:'admission', type:'round1', id:a.id});
    if(a.interviewRequired && a.interviewDate) list.push({date:a.interviewDate, title:`${a.university} 면접`, sub:(a.interviewTime? a.interviewTime+' · ':'')+a.admissionType, color:'#9b2c2c', kind:'admission', type:'interview', id:a.id});
    if(a.announceDate) list.push({date:a.announceDate, title:`${a.university} 최종 발표`, sub:a.admissionType, color:'#b8860b', kind:'admission', type:'announce', id:a.id});
  });
  Object.values(state.customEvents||{}).forEach(ev=>{
    list.push({date:ev.date, title:ev.title, sub:ev.memo||'내 일정', color:ev.color||'#3aa76d', kind:'custom', type:'custom', id:ev.id});
  });
  return list.filter(e=>e.date).sort((a,b)=> a.date.localeCompare(b.date));
}
function renderDday(){
  renderDdayFilters();
  const container = document.getElementById('ddayContainer');
  const all = collectAllEvents().filter(e=> ddayFilters[e.type]);
  if(all.length===0){
    container.innerHTML = '<div class="empty-note">표시할 일정이 없습니다. 필터를 확인하거나, 대학/전형에 날짜를 입력하거나 "내 일정 추가"를 눌러보세요.</div>';
    return;
  }
  const listEl = document.createElement('div'); listEl.className='dday-list';
  all.forEach(ev=>{
    const d = daysUntil(ev.date);
    const item = document.createElement('div'); item.className='dday-item' + (d<0?' past':'');
    let badgeClass = 'later', badgeText = `D-${d}`;
    if(d===0){ badgeClass='today'; badgeText='D-DAY'; }
    else if(d<0){ badgeClass='past'; badgeText=`D+${Math.abs(d)}`; }
    else if(d<=7){ badgeClass='soon'; badgeText=`D-${d}`; }
    item.innerHTML = `
      <span class="dday-colordot" style="background:${ev.color}"></span>
      <span class="dday-badge ${badgeClass}">${badgeText}</span>
      <span class="dday-info"><div class="title">${escapeHtml(ev.title)}</div><div class="sub">${escapeHtml(ev.sub||'')}</div></span>
      <span class="dday-date">${ev.date}</span>
    `;
    item.addEventListener('click', ()=> ev.kind==='custom' ? openEventModal(ev.id) : openModal(ev.id, 'view'));
    listEl.appendChild(item);
  });
  container.innerHTML = '';
  container.appendChild(listEl);
}

      <div class="field checkline"><input type="checkbox" id="f_rec" ${a.recommendation?'checked':''}><label for="f_rec" style="margin:0;">추천서 필요</label></div>
      <div class="field checkline"><input type="checkbox" id="f_selfintro" ${a.selfIntroRequired?'checked':''}><label for="f_selfintro" style="margin:0;">자기소개서 필요</label></div>
    </div>
    <div class="field"><label>수능 최저 기준 (해당 시)</label><input type="text" id="f_choitext" placeholder="예: 국,수,영,탐 중 2개 합 5 이내" value="${escapeHtml(a.suneungChoiText)}"></div>

    <div class="field">
      <label>자소서 문항</label>
      <div id="qList"></div>
      <button class="btn" id="addQBtn" type="button">+ 문항 추가</button>
    </div>

    <div class="field"><label>작년 입시결과 / 수시컷 참고 (선택)</label><input type="text" id="f_cutoff" placeholder="예: 작년 최종등록 평균 2.3등급, 경쟁률 8:1" value="${escapeHtml(a.cutoffNote)}"></div>

    <div class="field">
      <label>관련 사진 / 파일 첨부</label>
      <input type="file" id="f_file" multiple>
      <div class="file-list" id="fileList"></div>
      <small class="hint">⚠️ 사진/파일은 용량 문제로 <b>클라우드에 올라가지 않고 이 브라우저(기기)에만</b> 저장됩니다. 다른 기기에서는 파일이 보이지 않으니, 중요한 파일은 "백업 파일 다운로드"로 따로 보관해두세요.</small>
    </div>
    <div class="field">
      <label>관련 사이트 링크</label>
      <div style="display:flex; gap:6px;"><input type="url" id="f_linkurl" placeholder="https://..."><button class="btn" id="addLinkBtn" type="button" style="white-space:nowrap;">추가</button></div>
      <div class="link-list" id="linkList"></div>
      <small class="hint">해당 대학 입학처, 모집요강 페이지 등을 링크로 저장해두세요.</small>
    </div>

    <div class="field">
      <label>합격 가능성 (내 판단)</label>
      <div class="prob-select">
        <div class="prob-opt sel-상" data-v="상">상</div>
        <div class="prob-opt sel-중" data-v="중">중</div>
        <div class="prob-opt sel-하" data-v="하">하</div>
        <div class="prob-opt sel-미정" data-v="미정">미정</div>
      </div>
    </div>

    <div class="field"><label>메모</label><textarea id="f_memo" placeholder="전략 메모, 준비할 것, 특이사항 등">${escapeHtml(a.memo)}</textarea></div>

    <div class="modal-actions">
      <div class="left">${!isNew ? '<button class="btn danger-text" id="eDeleteBtn">삭제</button>' : ''}</div>
      <div class="left"><button class="btn" id="eCancelBtn">취소</button><button class="btn primary" id="eSaveBtn">저장</button></div>
    </div>
  `;

  document.querySelectorAll('#ivTypeGroup .chip-toggle').forEach(chip=>{
    chip.classList.toggle('active', tempIvTypes.includes(chip.dataset.v));
    chip.addEventListener('click', ()=>{
      const v = chip.dataset.v; const i = tempIvTypes.indexOf(v);
      if(i>=0) tempIvTypes.splice(i,1); else tempIvTypes.push(v);
      chip.classList.toggle('active');
    });
  });
  document.querySelectorAll('.prob-opt').forEach(opt=>{
    opt.classList.toggle('selected', opt.dataset.v === tempProb);
    opt.addEventListener('click', ()=>{
      tempProb = opt.dataset.v;
      document.querySelectorAll('.prob-opt').forEach(o=> o.classList.toggle('selected', o===opt));
    });
  });
  renderQList();
  renderFileList();
  renderLinkList();
  document.getElementById('f_file').addEventListener('change', (e)=>{
    Array.from(e.target.files).forEach(file=>{
      const reader = new FileReader();
      reader.onload = ()=>{ tempFiles.push({name:file.name, dataUrl:reader.result}); renderFileList(); };
      reader.readAsDataURL(file);
    });
    e.target.value='';
  });
  document.getElementById('addLinkBtn').addEventListener('click', ()=>{
    const input = document.getElementById('f_linkurl'); const url = input.value.trim();
    if(url){ tempLinks.push({url}); input.value=''; renderLinkList(); }
  });
  const PALETTE = ['#d97757','#3aa76d','#2f6fed','#b8860b','#9b2c2c','#7a4fd6','#0e9ba0','#e0518b'];
  const swWrap = document.getElementById('periodColorSwatches');
  function renderSwatches(){
    swWrap.innerHTML='';
    PALETTE.forEach(c=>{
      const sw = document.createElement('div'); sw.className='color-swatch' + (tempPeriodColor===c?' selected':'');
      sw.style.background=c;
      sw.addEventListener('click', ()=>{ tempPeriodColor=c; renderSwatches(); });
      swWrap.appendChild(sw);
    });
    const custom = document.createElement('input'); custom.type='color'; custom.value=tempPeriodColor;
    custom.style.width='26px'; custom.style.height='26px'; custom.style.border='none'; custom.style.borderRadius='7px'; custom.style.cursor='pointer'; custom.style.padding='0';
    custom.addEventListener('input', (e)=>{ tempPeriodColor=e.target.value; renderSwatches(); });
    swWrap.appendChild(custom);
  }
  renderSwatches();
  document.getElementById('addQBtn').addEventListener('click', ()=>{ tempQuestions.push(''); renderQList(); });
  document.getElementById('eCancelBtn').addEventListener('click', ()=>{
    if(isNew) closeModal(); else { modalMode='view'; renderViewMode(); }
  });
  if(!isNew) document.getElementById('eDeleteBtn').addEventListener('click', ()=>{
    if(!confirm('이 항목을 삭제할까요?')) return;
    delete state.admissions[editingId]; persist(); closeModal(); renderAll();
  });
  document.getElementById('eSaveBtn').addEventListener('click', ()=>{
    const university = document.getElementById('f_uni').value.trim();
    const admissionType = document.getElementById('f_type').value.trim();
    const department = document.getElementById('f_dept').value.trim();
    if(!university || !admissionType || !department){ alert('대학교, 전형 이름, 지원 학과는 필수입니다.'); return; }
    const id = editingId || uid('adm');
    state.admissions[id] = {
      id, university, admissionType, department,
      isCardSchool: document.getElementById('f_iscard').checked,
      applicationStart: document.getElementById('f_appstart').value,
      applicationEnd: document.getElementById('f_append').value,
      periodColor: tempPeriodColor,
      round1AnnounceDate: document.getElementById('f_round1announce').value,
      round1Ratio: document.getElementById('f_round1').value.trim(),
      documentWeight: document.getElementById('f_docweight').value.trim(),
      interviewWeight: document.getElementById('f_ivweight').value.trim(),
      interviewRequired: document.getElementById('f_ivrequired').checked,
      interviewDate: document.getElementById('f_ivdate').value,
      interviewTime: document.getElementById('f_ivtime').value,
      announceDate: document.getElementById('f_announce').value,
      interviewTypes: tempIvTypes,
      suneungChoi: document.getElementById('f_choi').checked,
      suneungChoiText: document.getElementById('f_choitext').value.trim(),
      recommendation: document.getElementById('f_rec').checked,
      selfIntroRequired: document.getElementById('f_selfintro').checked,
      selfIntroQuestions: tempQuestions.filter(q=>q.trim()),
      cutoffNote: document.getElementById('f_cutoff').value.trim(),
      probability: tempProb,
      memo: document.getElementById('f_memo').value.trim(),
      files: tempFiles,
      links: tempLinks,
    };
    persist();
    editingId = id; modalMode='view';
    renderViewMode();
    renderAll();
  });
}

function renderQList(){
  const list = document.getElementById('qList'); if(!list) return; list.innerHTML='';
  tempQuestions.forEach((q, idx)=>{
    const row = document.createElement('div'); row.className='q-item';
    const ta = document.createElement('textarea'); ta.value = q; ta.placeholder = `문항 ${idx+1}`;
    ta.addEventListener('input', ()=>{ tempQuestions[idx] = ta.value; });
    const x = document.createElement('button'); x.className='x-btn'; x.textContent='✕';
    x.addEventListener('click', ()=>{ tempQuestions.splice(idx,1); renderQList(); });
    row.appendChild(ta); row.appendChild(x); list.appendChild(row);
  });
}
function renderFileList(){
  const list = document.getElementById('fileList'); if(!list) return; list.innerHTML='';
  tempFiles.forEach((f, idx)=>{
    const div = document.createElement('div'); div.className='file-item';
    div.innerHTML = `<a href="${f.dataUrl}" target="_blank" rel="noopener">${escapeHtml(f.name)}</a>`;
    const x = document.createElement('button'); x.className='x-btn'; x.textContent='✕';
    x.addEventListener('click', ()=>{ tempFiles.splice(idx,1); renderFileList(); });
    div.appendChild(x); list.appendChild(div);
  });
}
function renderLinkList(){
  const list = document.getElementById('linkList'); if(!list) return; list.innerHTML='';
  tempLinks.forEach((l, idx)=>{
    const div = document.createElement('div'); div.className='link-item';
    div.innerHTML = `<a href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.url)}</a>`;
    const x = document.createElement('button'); x.className='x-btn'; x.textContent='✕';
    x.addEventListener('click', ()=>{ tempLinks.splice(idx,1); renderLinkList(); });
    div.appendChild(x); list.appendChild(div);
  });
}

/* ---------- import/export/menu ---------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `대입_전형_정리표_${localDateStr(new Date())}.json`; a.click(); URL.revokeObjectURL(url);
  menuDropdown.classList.remove('open');
});
document.getElementById('importTrigger').addEventListener('click', ()=> document.getElementById('importInput').click());
document.getElementById('importInput').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.admissions) throw new Error('형식 오류');
      if(confirm('현재 데이터를 덮어쓰고 불러올까요?')){ state = { admissions:data.admissions||{}, customEvents:data.customEvents||{}, lastSaved:data.lastSaved||null }; persist(); renderAll(); }
    }catch(err){ alert('파일을 읽는 중 오류가 발생했습니다.'); }
  };
  reader.readAsText(file); e.target.value=''; menuDropdown.classList.remove('open');
});
document.getElementById('restoreBackupBtn').addEventListener('click', ()=>{
  const raw = localStorage.getItem(STORAGE_KEY + '_backup');
  if(!raw){ alert('이 브라우저에 저장된 자동 백업이 없습니다.'); menuDropdown.classList.remove('open'); return; }
  try{
    const backup = JSON.parse(raw);
    const when = backup.lastSaved ? new Date(backup.lastSaved).toLocaleString('ko-KR') : '알 수 없음';
    if(confirm(`자동 백업(마지막 저장: ${when})으로 복원할까요? 현재 화면의 데이터는 덮어써집니다.`)){
      state = backup;
      persist(); renderAll();
    }
  }catch(e){ alert('백업 데이터를 읽는 중 오류가 발생했습니다.'); }
  menuDropdown.classList.remove('open');
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('정말 모든 데이터를 삭제할까요? 이 작업은 되돌릴 수 없습니다.')){ state = {admissions:{}, customEvents:{}, lastSaved:null}; persist(); renderAll(); }
  menuDropdown.classList.remove('open');
});

function loadSample(){
  if(Object.keys(state.admissions).length > 0 && !confirm('현재 데이터가 있습니다. 예시 데이터로 덮어쓸까요?')) { menuDropdown.classList.remove('open'); return; }
  state.admissions = {};
  const items = [
    {university:'한국대학교', admissionType:'학생부종합(미래인재)', department:'경영학과', isCardSchool:true,
     applicationStart: nextDate(5), applicationEnd: nextDate(9), round1AnnounceDate: nextDate(15),
     round1Ratio:'3배수', interviewRatio:'3배수', documentWeight:'70%', interviewWeight:'30%', interviewRequired:true, interviewDate: nextDate(20), interviewTime:'10:00',
     announceDate: nextDate(55), interviewTypes:['생기부 기반'], suneungChoi:false, suneungChoiText:'',
     recommendation:false, selfIntroRequired:true, selfIntroQuestions:['고교 재학 중 가장 의미 있었던 학업 경험을 서술하시오.','지원 동기와 진학 후 학업 계획을 서술하시오.'],
     cutoffNote:'작년 최종등록 평균 2.1등급', probability:'중', memo:'전공적합성 강조 필요'},
    {university:'한국대학교', admissionType:'논술전형', department:'경제학과', isCardSchool:true,
     applicationStart: nextDate(5), applicationEnd: nextDate(9), round1AnnounceDate:'',
     round1Ratio:'-', interviewRatio:'', documentWeight:'', interviewWeight:'', interviewRequired:false, interviewDate:'', interviewTime:'',
     announceDate: nextDate(60), interviewTypes:[], suneungChoi:true, suneungChoiText:'국,수,영,탐 중 3개 합 6 이내',
     recommendation:false, selfIntroRequired:false, selfIntroQuestions:[],
     cutoffNote:'논술 경쟁률 40:1', probability:'하', memo:'수능 최저 충족 여부 우선 확인'},
    {university:'서울미래대학교', admissionType:'학생부교과(지역균형)', department:'컴퓨터공학과', isCardSchool:true,
     applicationStart: nextDate(3), applicationEnd: nextDate(7), round1AnnounceDate:'',
     round1Ratio:'5배수', interviewRatio:'없음', documentWeight:'', interviewWeight:'', interviewRequired:false, interviewDate:'', interviewTime:'',
     announceDate: nextDate(50), interviewTypes:[], suneungChoi:true, suneungChoiText:'국,수,영,과 중 2개 합 4 이내',
     recommendation:false, selfIntroRequired:false, selfIntroQuestions:[],
     cutoffNote:'작년 컷 1.6등급', probability:'상', memo:'교과 성적 안정권'},
    {university:'서울미래대학교', admissionType:'학생부종합(창의인재)', department:'소프트웨어학과', isCardSchool:false,
     applicationStart: nextDate(3), applicationEnd: nextDate(7), round1AnnounceDate: nextDate(18),
     round1Ratio:'4배수', interviewRatio:'4배수', documentWeight:'0% (순수 면접 100%)', interviewWeight:'100%', interviewRequired:true, interviewDate: nextDate(25), interviewTime:'14:30',
     announceDate: nextDate(58), interviewTypes:['제시문 기반','특수(영어면접 등)'], suneungChoi:false, suneungChoiText:'',
     recommendation:true, selfIntroRequired:true, selfIntroQuestions:['전공 관련 탐구 활동 중 대표 사례를 서술하시오.'],
     cutoffNote:'특기자 전형 성격, 6장 카드 외 별도 지원', probability:'미정', memo:'영어 면접 준비 필요 - 스크립트 연습'},
  ];
  items.forEach(it=>{ const id = uid('adm'); state.admissions[id] = {id, ...it}; });
  persist(); renderAll(); menuDropdown.classList.remove('open');
}
function nextDate(daysFromNow){ const d = new Date(); d.setDate(d.getDate()+daysFromNow); return localDateStr(d); }
document.getElementById('loadSampleBtn').addEventListener('click', loadSample);

renderAll();
</script>
</body>
</html>
